[project]
name = "ai-platform-ownership-monorepo"
version = "0.1.0"
description = "One repo for API, workflows, models, and infra, split by owner so each change is reviewed and tested with the code it affects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-anthropic>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["app"]
